<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSC Science Pro Revision Hub</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            margin: 0;
            padding: 30px 15px;
            color: var(--text-dark);
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-badge {
            background: #e0f2fe;
            color: #0284c7;
            font-weight: 700;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: inline-block;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--text-dark);
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 800;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 15px;
        }

        /* Overall Progress Box */
        .overall-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.15);
        }

        .overall-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .progress-box {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            overflow: hidden;
            height: 22px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #34d399);
            text-align: center;
            color: white;
            font-weight: 700;
            line-height: 22px;
            transition: width 0.4s ease;
            font-size: 12px;
        }

        /* Navigation Tabs */
        .tabs-header {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
        }

        .tab-btn {
            background: #f1f5f9;
            color: var(--text-muted);
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: #e2e8f0;
            color: var(--text-dark);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Subject Slide Panels */
        .subject-slide {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .subject-slide.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .slide-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .paper-bar-container {
            width: 140px;
            background: #e2e8f0;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
        }

        .paper-bar-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Chapter Checklist Items */
        .chapter-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .chapter-item {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .chapter-item:hover {
            border-color: #cbd5e1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            transform: translateY(-1px);
        }

        .chapter-item input[type="checkbox"] {
            margin-right: 14px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-green);
        }

        .chapter-item label {
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            width: 100%;
        }

        /* Add Chapter Box */
        .add-box {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .add-box input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .add-box input[type="text"]:focus {
            border-color: var(--primary);
        }

        .add-box button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .add-box button:hover {
            background: var(--primary-hover);
        }

        .icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="header-badge">HSC Science Division</span>
        <h1>NCTB Revision Dashboard</h1>
        <p class="subtitle">Select a subject tab to manage your preparation</p>
    </div>

    <!-- Overall Global Progress Card -->
    <div class="overall-card">
        <div class="overall-title">
            <span>Overall Syllabus Completion</span>
            <span id="overallText">0% Completed</span>
        </div>
        <div class="progress-box">
            <div id="progressBar" class="progress-bar">0%</div>
        </div>
    </div>

    <!-- Horizontal Tabs for Navigation -->
    <div class="tabs-header" id="tabsHeader"></div>

    <!-- Slide Panels Container -->
    <div id="slidesContainer"></div>
</div>

<script>
    const defaultData = {
        "Physics 1st": {
            icon: "⚡",
            chapters: ["Ch 1: Physical World and Measurement", "Ch 2: Vectors", "Ch 3: Dynamics", "Ch 4: Newtonian Mechanics", "Ch 5: Work, Energy and Power", "Ch 6: Gravitation and Gravity", "Ch 7: Structural Properties of Matter", "Ch 8: Periodic Motion", "Ch 9: Waves", "Ch 10: Ideal Gas and Kinetic Theory"]
        },
        "Physics 2nd": {
            icon: "🧲",
            chapters: ["Ch 1: Thermodynamics", "Ch 2: Static Electricity", "Ch 3: Current Electricity", "Ch 4: Magnetic Effects of Current", "Ch 5: Electromagnetic Induction", "Ch 6: Geometrical Optics", "Ch 7: Physical Optics", "Ch 8: Introduction to Modern Physics", "Ch 9: Atomic Model & Nuclear Physics", "Ch 10: Semiconductor & Electronics", "Ch 11: Astronomy"]
        },
        "Chemistry 1st": {
            icon: "🧪",
            chapters: ["Ch 1: Safe Use of Laboratory", "Ch 2: Qualitative Chemistry", "Ch 3: Periodic Properties & Bonding", "Ch 4: Chemical Changes", "Ch 5: Working Chemistry"]
        },
        "Chemistry 2nd": {
            icon: "⚗️",
            chapters: ["Ch 1: Environmental Chemistry", "Ch 2: Organic Chemistry", "Ch 3: Quantitative Chemistry", "Ch 4: Electrochemistry", "Ch 5: Economic Chemistry"]
        },
        "Higher Math 1st": {
            icon: "📐",
            chapters: ["Ch 1: Matrices and Determinants", "Ch 2: Vectors", "Ch 3: Straight Lines", "Ch 4: Circles", "Ch 5: Permutations and Combinations", "Ch 6: Trigonometric Ratios", "Ch 7: Trigonometric Ratios of Associated Angles", "Ch 8: Functions & Function Graphs", "Ch 9: Differentiation", "Ch 10: Integration"]
        },
        "Higher Math 2nd": {
            icon: "📊",
            chapters: ["Ch 1: Real Numbers & Inequalities", "Ch 2: Linear Programming", "Ch 3: Complex Numbers", "Ch 4: Polynomials & Polynomial Equations", "Ch 5: Binomial Expansion", "Ch 6: Conics", "Ch 7: Inverse Trigonometric Functions", "Ch 8: Statics", "Ch 9: Dynamics (Particle Motion)", "Ch 10: Dispersion & Probability"]
        },
        "Botany": {
            icon: "🌿",
            chapters: ["Ch 1: Cell and its Structure", "Ch 2: Cell Division", "Ch 3: Cell Chemistry", "Ch 4: Microorganisms", "Ch 5: Algae and Fungi", "Ch 6: Bryophyta and Pteridophyta", "Ch 7: Gymnosperms & Angiosperms", "Ch 8: Tissue and Tissue System", "Ch 9: Plant Physiology", "Ch 10: Plant Reproduction", "Ch 11: Biotechnology", "Ch 12: Environment & Ecosystem"]
        },
        "Zoology": {
            icon: "🐾",
            chapters: ["Ch 1: Animal Diversity & Classification", "Ch 2: Animal Introduction (Hydra, Grasshopper, Rohu)", "Ch 3: Digestion and Absorption", "Ch 4: Circulation and Blood", "Ch 5: Respiration and Breathing", "Ch 6: Excretion and Regulation", "Ch 7: Locomotion and Movement", "Ch 8: Coordination and Control", "Ch 9: Human Reproduction", "Ch 10: Defense & Immunology", "Ch 11: Genetics and Evolution", "Ch 12: Animal Behavior"]
        }
    };

    let activeTabKey = "Physics 1st";

    function getCustomChapters(subject) {
        let saved = localStorage.getItem("custom_" + subject);
        return saved ? JSON.parse(saved) : [];
    }

    function saveCustomChapter(subject, chapterName) {
        let existing = getCustomChapters(subject);
        existing.push(chapterName);
        localStorage.setItem("custom_" + subject, JSON.stringify(existing));
    }

    function renderApp() {
        const tabsHeader = document.getElementById("tabsHeader");
        const slidesContainer = document.getElementById("slidesContainer");

        tabsHeader.innerHTML = "";
        slidesContainer.innerHTML = "";

        for (let subject in defaultData) {
            const data = defaultData[subject];

            // Build Tab Button
            const tabBtn = document.createElement("button");
            tabBtn.className = `tab-btn ${subject === activeTabKey ? 'active' : ''}`;
            tabBtn.innerHTML = `<span class="icon">${data.icon}</span> ${subject}`;
            tabBtn.onclick = () => {
                activeTabKey = subject;
                renderApp();
            };
            tabsHeader.appendChild(tabBtn);

            // Build Slide Panel
            const slide = document.createElement("div");
            slide.className = `subject-slide ${subject === activeTabKey ? 'active' : ''}`;

            // Slide Header
            const slideHeader = document.createElement("div");
            slideHeader.className = "slide-header";
            
            const allChapters = [...data.chapters, ...getCustomChapters(subject)];
            const checkedCount = allChapters.filter(chap => {
                const id = `${subject}-${chap.replace(/[^a-zA-Z0-9]/g, '')}`;
                return localStorage.getItem(id) === "true";
            }).length;

            const paperPercent = allChapters.length > 0 ? Math.round((checkedCount / allChapters.length) * 100) : 0;

            slideHeader.innerHTML = `
                <div class="slide-title">
                    <span class="icon">${data.icon}</span> ${subject} Paper
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">${checkedCount}/${allChapters.length} Done</span>
                    <div class="paper-bar-container">
                        <div class="paper-bar-fill" style="width: ${paperPercent}%;"></div>
                    </div>
                </div>
            `;
            slide.appendChild(slideHeader);

            // Chapter Checklist
            const ul = document.createElement("ul");
            ul.className = "chapter-list";

            allChapters.forEach((chap) => {
                const li = document.createElement("li");
                li.className = "chapter-item";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "tracker-checkbox";
                const checkId = `${subject}-${chap.replace(/[^a-zA-Z0-9]/g, '')}`;
                checkbox.id = checkId;

                if (localStorage.getItem(checkId) === "true") {
                    checkbox.checked = true;
                }

                checkbox.addEventListener("change", () => {
                    localStorage.setItem(checkId, checkbox.checked);
                    renderApp(); // Refresh to update progress bars
                });

                const label = document.createElement("label");
                label.htmlFor = checkId;
                label.innerText = chap;

                li.appendChild(checkbox);
                li.appendChild(label);
                ul.appendChild(li);
            });

            slide.appendChild(ul);

            // Add Custom Chapter Field
            const addBox = document.createElement("div");
            addBox.className = "add-box";

            const input = document.createElement("input");
            input.type = "text";
            input.placeholder = `Add custom topic to ${subject}...`;

            const btn = document.createElement("button");
            btn.innerText = "+ Add Topic";

            btn.onclick = () => {
                const val = input.value.trim();
                if (val !== "") {
                    saveCustomChapter(subject, val);
                    input.value = "";
                    renderApp();
                }
            };

            addBox.appendChild(input);
            addBox.appendChild(btn);
            slide.appendChild(addBox);

            slidesContainer.appendChild(slide);
        }

        updateOverallProgress();
    }

    function updateOverallProgress() {
        const checkboxes = document.querySelectorAll('.tracker-checkbox');
        const checkedCount = document.querySelectorAll('.tracker-checkbox:checked').length;
        const total = checkboxes.length;

        const percentage = total > 0 ? Math.round((checkedCount / total) * 100) : 0;
        const bar = document.getElementById("progressBar");
        const overallText = document.getElementById("overallText");

        bar.style.width = percentage + "%";
        bar.innerText = percentage + "%";
        overallText.innerText = `${percentage}% Completed (${checkedCount}/${total} Chapters)`;
    }

    renderApp();
</script>

</body>
</html>
